name: Build Gerald CIA

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install helper packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pil unzip wget ca-certificates

      - name: Install makerom and bannertool
        run: |
          mkdir -p /opt/tools && cd /opt/tools
          wget -q https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip -O makerom.zip
          unzip -o makerom.zip
          wget -q https://github.com/carstene1ns/3ds-bannertool/releases/download/v1.2.0/bannertool.zip -O bannertool.zip
          unzip -o bannertool.zip
          cp makerom /usr/local/bin/ && chmod +x /usr/local/bin/makerom
          cp linux-x86_64/bannertool /usr/local/bin/ && chmod +x /usr/local/bin/bannertool

      - name: Generate pixel art + sounds
        run: python3 tools/gen_assets.py

      - name: Build .3dsx / .elf / .smdh
        run: make

      - name: Make banner
        run: bannertool makebanner -i meta/banner.png -a meta/banner.wav -o banner.bin

      - name: Build CIA
        run: |
          makerom -f cia -o gerald.cia -target t -exefslogo \
            -elf gerald.elf -rsf meta/app.rsf \
            -icon gerald.smdh -banner banner.bin \
            -major 1 -minor 0 -micro 0 \
            -DAPP_TITLE="Gerald" \
            -DAPP_PRODUCT_CODE="CTR-P-GRLD" \
            -DAPP_UNIQUE_ID=0xF8A21 \
            -DAPP_ROMFS=romfs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gerald
          path: |
            gerald.cia
            gerald.3dsx
